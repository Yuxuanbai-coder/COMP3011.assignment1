<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audio Transcription</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="recording-panel">
    <p class="eyebrow">COMP3011 Assignment 1</p>
    <h1>Audio recorder</h1>
    <p class="intro">Record a short clip using your browser microphone.</p>

    <div class="controls" role="group" aria-label="Recording controls">
        <button id="startButton" type="button">Start</button>
        <button id="stopButton" type="button" disabled>Stop</button>
    </div>

    <p id="status" class="status" role="status">Ready to record.</p>
    <dl class="recording-details" aria-live="polite">
        <div><dt>Format</dt><dd id="format">-</dd></div>
        <div><dt>Size</dt><dd id="size">-</dd></div>
    </dl>
    <audio id="audioPreview" controls hidden></audio>
</main>
<script src="/app.js"></script>
</body>
</html>
